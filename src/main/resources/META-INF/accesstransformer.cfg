# Font#getFontSet is package-private, but we need the FontSet to look up BakedGlyphs
# once and cache them. The HUD draws up to 256x128 cells per frame; going through
# Font#drawInBatch per cell allocates (StringRenderOutput + a Matrix4f copy) and
# re-resolves the font set / glyph info / glyph every single time.
public net.minecraft.client.gui.Font getFontSet(Lnet/minecraft/resources/ResourceLocation;)Lnet/minecraft/client/gui/font/FontSet;
